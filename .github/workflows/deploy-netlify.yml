name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run type check
        run: pnpm typecheck
      
      - name: Run linter
        run: pnpm lint
      
      - name: Run tests
        run: pnpm test
      
      - name: Build
        run: pnpm build

      - name: Configure production Sanity runtime
        if: github.ref == 'refs/heads/main'
        run: |
          pnpm exec netlify env:set CONTENT_MODE sanity --context production --scope functions --site "$NETLIFY_SITE_ID" --force
          pnpm exec netlify env:set SANITY_PROJECT_ID vjmj7stb --context production --scope functions --site "$NETLIFY_SITE_ID" --force
          pnpm exec netlify env:set SANITY_DATASET helpcenterdevelopment --context production --scope functions --site "$NETLIFY_SITE_ID" --force
          pnpm exec netlify env:set SANITY_API_VERSION 2025-02-19 --context production --scope functions --site "$NETLIFY_SITE_ID" --force
          pnpm exec netlify env:set SITE_URL https://mwhelpcenter.netlify.app --context production --scope functions --site "$NETLIFY_SITE_ID" --force
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: 'apps/web/build/client'
          functions-dir: 'apps/web/.netlify/v1/functions'
          production-branch: main
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.event.head_commit.message }}"
          netlify-config-path: './netlify.toml'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
