[build]
  command = "pnpm --filter @mw/web build"
  publish = "apps/web/build/client"
  environment = { NODE_VERSION = "22.23.3" }

# Environment variables (set these in Netlify UI or .env file)
[env]
  [env.production]
    NODE_ENV = "production"
    CONTENT_MODE = "sanity"

  [env.deploy-preview]
    NODE_ENV = "production"
    CONTENT_MODE = "sanity"

  [env.branch-deploy]
    NODE_ENV = "development"
    CONTENT_MODE = "demo"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
