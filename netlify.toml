[build]
  command = "pnpm --filter @mw/web build"
  publish = "apps/web/build/client"
  functions = "apps/web/.netlify/v1/functions"

[build.environment]
  NODE_VERSION = "22.23.3"

# Environment variables (set these in Netlify UI or .env file)
[context.production.environment]
    NODE_ENV = "production"
    CONTENT_MODE = "sanity"
    SANITY_PROJECT_ID = "vjmj7stb"
    SANITY_DATASET = "helpcenterdevelopment"
    SANITY_API_VERSION = "2025-02-19"
    SITE_URL = "https://mwhelpcenter.netlify.app"

[context.deploy-preview.environment]
    NODE_ENV = "production"
    CONTENT_MODE = "demo"

[context.branch-deploy.environment]
    NODE_ENV = "development"
    CONTENT_MODE = "demo"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
